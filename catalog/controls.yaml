# NIST SP 800-171 Rev 2 control catalog
#
# Generated from the primary sources, not hand-typed:
#   - Requirement text and family: docs/source/sp800-171r2-requirements.csv
#     (NIST SP 800-171 Rev 2, upd1, supplemental CSV of security requirements)
#   - NIST SP 800-53 Rev 4 mapping: Appendix D, Tables D-1 / D-3 / D-5 of
#     docs/source/sp800-171r2.pdf
#   - Point values: NIST SP 800-171 DoD Assessment Methodology, Version 1.2.1,
#     June 24, 2020, Annex A
#
# Requirement text is verbatim from the CSV except that NIST's footnote markers
# (e.g. '[23]') and the punctuation they strand have been removed.
#
# SCOPE: in_scope is true only for the AC, AU and IA families (42 of 110).
# Point values for the remaining 68 requirements are null. If another family is
# ever brought into scope, its values must be transcribed from Annex A of the DoD
# Assessment Methodology before it can affect a score -- do not guess them.
#
# MAPPING NOTES: three entries below are broader than Appendix D read literally,
# because the build specification supplies a combined list for each pair:
#   3.1.1 / 3.1.2  spec [AC-2, AC-3, AC-17]; Appendix D lists AC-2 against 3.1.1
#                  and AC-3, AC-17 against 3.1.2.
#   3.3.1 / 3.3.2  spec [AU-2, AU-3, AU-3(1), AU-6, AU-12]; Appendix D lists
#                  AU-2, AU-3, AU-3(1) against 3.3.1 and AU-6, AU-11, AU-12
#                  against 3.3.2. Note AU-11 (Audit Record Retention) is in
#                  Appendix D but not in the spec list.
#   3.5.1 / 3.5.2  spec [IA-2, IA-5]; Appendix D lists IA-2 against 3.5.1 and
#                  IA-3, IA-5 against 3.5.2. Note IA-3 (Device Identification and
#                  Authentication) is in Appendix D but not in the spec list.
# The mapping is documentation, not scoring input, so these do not affect SPRS.

metadata:
  standard: "NIST SP 800-171 Rev 2"
  scoring_methodology: "NIST SP 800-171 DoD Assessment Methodology, Version 1.2.1, June 24, 2020"
  mapping_standard: "NIST SP 800-53 Rev 4"
  total_requirements: 110
  in_scope_requirements: 42
  in_scope_families: [AC, AU, IA]

controls:

