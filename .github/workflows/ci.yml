# Continuous integration: every push and pull request is linted, type-checked, tested and
# scanned for committed secrets. Nothing here touches AWS -- the tests run against moto
# and a hand-made evidence fixture, and the runner has no AWS credentials.

name: CI

on:
  push:
  pull_request:
  # Push and pull-request runs scan only the new commits for secrets. A manual run
  # (Actions tab -> CI -> Run workflow) and the weekly schedule scan the entire history.
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC

# Least privilege: the default token can read the repository and nothing else.
permissions:
  contents: read

# A newer push to the same branch cancels the run it makes obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, type check and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
          pip install -e .

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Type check (mypy)
        run: mypy src

      - name: Test (pytest, fails below 80% coverage)
        run: pytest --cov=src/nist171 --cov-report=xml --cov-report=term

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn

  secrets:
    name: Secrets scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read # to list a pull request's commits
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history, not just the latest commit

      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Commenting on pull requests would need write access; the job summary and the
          # uploaded report already show any finding.
          GITLEAKS_ENABLE_COMMENTS: "false"
