[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nist171-collector"
description = "Partial automated assessment of an AWS account against NIST SP 800-171 Rev 2 (AC, AU, IA families)."
readme = "README.md"
requires-python = ">=3.12"
dynamic = ["version"]
dependencies = [
    "boto3>=1.43",
    "PyYAML>=6.0",
    "Jinja2>=3.1",
    "click>=8.5",
    "rich>=15.0",
]

[project.scripts]
nist171 = "nist171.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.dynamic]
version = { attr = "nist171.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"nist171.reporting" = ["templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Coverage is measured only when asked for (pytest --cov), so running one test file on its
# own is not failed for covering too little of the package.
[tool.coverage.run]
source = ["src/nist171"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F: pycodestyle errors and pyflakes (real bugs: unused names, undefined names).
# I: import sorting. UP: rewrite to modern Python syntax for the target version.
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
warn_return_any = true

# boto3, botocore and moto ship without type information. Without this, mypy reports
# every import of them as an error.
[[tool.mypy.overrides]]
module = ["boto3", "boto3.*", "botocore.*", "moto", "moto.*"]
ignore_missing_imports = true
